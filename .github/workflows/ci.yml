name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同じブランチで新しい push があれば古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # engines.node は >=20。最小サポート版で検証する
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: lint + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint:check は layerge/ と demo/src/ の双方を検査する（ROADMAP A-9）
      - run: pnpm lint:check

      # TypeScript 移行中は型検査が独立した検査対象になる。
      # lint:check は typescript-eslint の構文ベースのルールしか見ないため、
      # これが無いと tsc の通らないコードが緑で通る（移行仕様書 第 4 章）
      - run: pnpm typecheck

      - run: pnpm test

      # ROADMAP B-5 の手書き型定義の同一性チェックは、段階 7 で型定義が
      # ビルド生成に切り替わったため不要になった（生成と複製で同一性が保証される）。

      # 公開ビルドが通ること自体も検証対象
      - run: pnpm build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm e2e:install-deps

      - run: pnpm e2e:install

      # demo は vite の alias で layerge/ のソースを直接参照するため、事前ビルドは不要
      - run: pnpm test:e2e

      - name: 失敗時のトレースを保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  pack-and-consumers:
    name: npm pack + consumer build / typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - consumer-vue-router-4
          - consumer-vue-router-5
          # 出荷する型定義を利用者と同じ解決方式で検査する（ROADMAP A-19）。
          # 既存 2 つは vite build のみで .ts を持たないため、型定義は検証されない
          - consumer-types
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm pack は prepack を持たないため、dist は先に作っておく必要がある
      - run: pnpm build

      - name: 公開物の構成を検証する
        run: node scripts/verify-pack.mjs

      # 単体テストも E2E も layerge/ のソースを対象にしているため、
      # dist/ を実際に読み込む検証はここだけ（ROADMAP B-4）
      - name: ビルド成果物を実際に読み込む
        run: node scripts/smoke-dist.mjs

      # consumer は file:../layerge.tgz を参照する。npm pack の生成物は
      # バージョン入りの名前になるため、固定名へ改名してから渡す（ROADMAP B-3）
      - name: tarball を固定名で生成する
        run: node scripts/pack-for-consumers.mjs

      # consumer は workspace の外側にあるため --ignore-workspace が必要。
      # また tarball の integrity は毎回変わるので lockfile は固定できない
      # （lockfile 自体は vue / vue-router / vite の固定に使っている）。
      - name: 消費側をインストールする
        working-directory: ${{ matrix.consumer }}
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      # consumer-types は build を持たず typecheck を持つ。逆も同じなので
      # --if-present で両方を試す（どちらか一方は必ず実行される）
      - name: 消費側をビルドする
        working-directory: ${{ matrix.consumer }}
        run: pnpm run --if-present build

      - name: 消費側で型検査する
        working-directory: ${{ matrix.consumer }}
        run: pnpm run --if-present typecheck
